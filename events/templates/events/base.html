<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Платформа подій{% endblock %}</title>
    <!-- Підключення Tailwind CSS через CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Навігаційна панель -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-xl font-bold text-indigo-600">EventPlatform</a>
            <nav class="space-x-6">
                <a href="/" class="hover:text-indigo-600 font-medium">Головна</a>
                <!-- Посилання на профіль або створення події -->
                <a href="{% url 'event-create' %}" class="hover:text-indigo-600 font-medium">Створити подію</a>
            </nav>
        </div>
    </header>

    <!-- Основний контент сторінки -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        {% block content %}
        <!-- Вміст інших сторінок -->
        {% endblock %}
    </main>

    <!-- Футер -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-sm text-gray-500">
        <p>&copy; 2026 Платформа подій. Усі права захищені.</p>
    </footer>

</body>
</html>
